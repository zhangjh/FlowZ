[package]
name = "flowz"
version = "3.7.5"
description = "FlowZ - Tauri 2 migration scaffold (phase 1). Rust backend is being ported incrementally; see TODOs in src/lib.rs."
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "flowz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
